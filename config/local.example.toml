# Machine settings of stock_overflow_infra. Copy this file to config/local.toml (git-ignored) on each machine and fill it in.
# Never commit config/local.toml: it names folders and addresses of your machines.

# The complete data tree (the quarantine), NEVER the development view (SO_DATA_PATH).
#   The local quarantine folder on the desktop (the laptop ingest was retired on 2026-11-12), e.g. "D:/<folder>/quarantine/"
# The environment variable SO_INGEST_TARGET_ROOT overrides this value (the tests use it).
target_root = ""

# IB Gateway on this machine (4001 Gateway live, 4002 Gateway paper). Turn on "Read-Only API" in the Gateway's API settings.
ibkr_host = "127.0.0.1"
ibkr_port = 4001
ibkr_client_id = 1

# Printed output (every tool) names a date only if it is before this one; later dates print as ####-##-##.
# Keep it at or before the start of the active holdout window. It must be written YYYY-MM-DD; a date later than 2025-01-01 also
# needs print_dates_before_later_ok = true (otherwise every script stops).
print_dates_before = "2025-01-01"
